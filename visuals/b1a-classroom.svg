<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <!-- B1a: classroom on a winter afternoon, windows shut, air gone stale.
       The companion panel is B1b, a bedroom. The two share the dot haze
       exactly: that repetition is what says "the same thing happens at
       home". Flat elevation, no perspective.
       Bodies are white, not accent-soft: accent-soft is the wall colour
       here, so filled shapes drawn in it disappear. -->
  <g stroke-linecap="round" stroke-linejoin="round">

    <!-- room shell -->
    <rect x="18" y="18" width="564" height="502" fill="#e4f0f3"/>
    <rect x="18" y="520" width="564" height="62" fill="#c9d3d8"/>
    <rect x="18" y="18" width="564" height="564" rx="8" fill="none" stroke="#1d2a33" stroke-width="4"/>

    <!-- stale air, thickest at the ceiling -->
    <g fill="#1f6f8b" opacity="0.26">
      <circle cx="74" cy="56" r="9"/>
      <circle cx="146" cy="44" r="7"/>
      <circle cx="222" cy="64" r="9.5"/>
      <circle cx="300" cy="46" r="7.5"/>
      <circle cx="378" cy="62" r="9"/>
      <circle cx="452" cy="44" r="7"/>
      <circle cx="524" cy="60" r="8.5"/>
    </g>
    <g fill="#1f6f8b" opacity="0.16">
      <circle cx="108" cy="112" r="7"/>
      <circle cx="266" cy="124" r="6"/>
      <circle cx="420" cy="110" r="7.5"/>
      <circle cx="540" cy="138" r="6"/>
      <circle cx="176" cy="186" r="6.5"/>
      <circle cx="322" cy="196" r="5.5"/>
      <circle cx="286" cy="312" r="6"/>
      <circle cx="486" cy="322" r="5"/>
    </g>

    <!-- board, on the left wall. Nothing written on it: no text in these -->
    <rect x="56" y="140" width="184" height="116" rx="4" fill="#ffffff" stroke="#1d2a33" stroke-width="4"/>
    <path d="M48 262 L248 262" stroke="#1d2a33" stroke-width="4"/>

    <!-- window, shut. Pale winter daylight behind the glass -->
    <rect x="372" y="136" width="176" height="140" rx="3" fill="#c9d3d8" stroke="#1d2a33" stroke-width="4"/>
    <path d="M460 136 L460 276" stroke="#1d2a33" stroke-width="3.4"/>
    <path d="M372 206 L548 206" stroke="#1d2a33" stroke-width="3.4"/>
    <path d="M452 198 L468 198" stroke="#1d2a33" stroke-width="4"/>
    <path d="M358 286 L562 286" stroke="#1d2a33" stroke-width="4"/>

    <!-- three pupils at desks, seen from the side -->
    <g fill="#ffffff" stroke="#1d2a33" stroke-width="4">
      <path d="M83 448 C 85 422, 99 408, 119 406 C 139 408, 153 422, 155 448 Z"/>
      <path d="M265 448 C 267 422, 281 408, 301 406 C 321 408, 335 422, 337 448 Z"/>
      <path d="M447 448 C 449 422, 463 408, 483 406 C 503 408, 517 422, 519 448 Z"/>
      <circle cx="119" cy="374" r="30"/>
      <circle cx="301" cy="374" r="30"/>
      <circle cx="483" cy="374" r="30"/>
      <rect x="54" y="446" width="130" height="16" rx="5"/>
      <rect x="236" y="446" width="130" height="16" rx="5"/>
      <rect x="418" y="446" width="130" height="16" rx="5"/>
    </g>
    <g stroke="#1d2a33" stroke-width="4">
      <path d="M64 462 L64 520"/>
      <path d="M174 462 L174 520"/>
      <path d="M246 462 L246 520"/>
      <path d="M356 462 L356 520"/>
      <path d="M428 462 L428 520"/>
      <path d="M538 462 L538 520"/>
    </g>
  </g>
</svg>
