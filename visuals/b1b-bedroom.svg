<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <!-- B1b: a bedroom at night, door and window shut, air gone stale.
       Deliberately not the infographic's I1: mirrored (window left, door
       right), taller framing that shows ceiling and floor, and a bedside
       table with the lamp off, which I1 does not have.
       The dot haze is drawn exactly as in B1a. Flat elevation. -->
  <g stroke-linecap="round" stroke-linejoin="round">

    <!-- room shell -->
    <rect x="18" y="18" width="564" height="502" fill="#e4f0f3"/>
    <rect x="18" y="520" width="564" height="62" fill="#c9d3d8"/>
    <rect x="18" y="18" width="564" height="564" rx="8" fill="none" stroke="#1d2a33" stroke-width="4"/>

    <!-- stale air, thickest at the ceiling. Same treatment as B1a -->
    <g fill="#1f6f8b" opacity="0.26">
      <circle cx="74" cy="56" r="9"/>
      <circle cx="146" cy="44" r="7"/>
      <circle cx="222" cy="64" r="9.5"/>
      <circle cx="300" cy="46" r="7.5"/>
      <circle cx="378" cy="62" r="9"/>
      <circle cx="452" cy="44" r="7"/>
      <circle cx="524" cy="60" r="8.5"/>
    </g>
    <g fill="#1f6f8b" opacity="0.16">
      <circle cx="108" cy="112" r="7"/>
      <circle cx="266" cy="124" r="6"/>
      <circle cx="420" cy="110" r="7.5"/>
      <circle cx="540" cy="138" r="6"/>
      <circle cx="176" cy="186" r="6.5"/>
      <circle cx="322" cy="196" r="5.5"/>
      <circle cx="286" cy="312" r="6"/>
      <circle cx="486" cy="322" r="5"/>
    </g>

    <!-- window, shut, night sky and a moon -->
    <rect x="52" y="140" width="164" height="140" rx="3" fill="#c9d3d8" stroke="#1d2a33" stroke-width="4"/>
    <circle cx="104" cy="186" r="20" fill="#ffffff"/>
    <path d="M134 140 L134 280" stroke="#1d2a33" stroke-width="3.4"/>
    <path d="M52 210 L216 210" stroke="#1d2a33" stroke-width="3.4"/>
    <path d="M126 202 L142 202" stroke="#1d2a33" stroke-width="4"/>
    <path d="M38 290 L230 290" stroke="#1d2a33" stroke-width="4"/>

    <!-- door, shut, on the right -->
    <rect x="452" y="186" width="112" height="334" rx="3" fill="#ffffff" stroke="#1d2a33" stroke-width="4"/>
    <rect x="470" y="210" width="76" height="126" rx="3" fill="none" stroke="#1f6f8b" stroke-width="3.4"/>
    <rect x="470" y="366" width="76" height="126" rx="3" fill="none" stroke="#1f6f8b" stroke-width="3.4"/>
    <circle cx="466" cy="358" r="6" fill="#1d2a33"/>

    <!-- bedside table, clear of the bed, with the lamp off -->
    <path d="M318 412 L326 380 L354 380 L362 412 Z" fill="#e4f0f3" stroke="#1d2a33" stroke-width="4"/>
    <path d="M340 412 L340 432" stroke="#1d2a33" stroke-width="4"/>
    <rect x="326" y="432" width="28" height="10" rx="3" fill="#ffffff" stroke="#1d2a33" stroke-width="4"/>
    <rect x="300" y="442" width="80" height="78" rx="4" fill="#ffffff" stroke="#1d2a33" stroke-width="4"/>
    <path d="M300 476 L380 476" stroke="#1d2a33" stroke-width="3.4"/>

    <!-- bed, someone asleep under the duvet -->
    <rect x="58" y="330" width="30" height="190" rx="5" fill="#e4f0f3" stroke="#1d2a33" stroke-width="4"/>
    <rect x="76" y="428" width="206" height="46" rx="8" fill="#ffffff" stroke="#1d2a33" stroke-width="4"/>
    <path d="M88 472 L88 520" stroke="#1d2a33" stroke-width="4"/>
    <path d="M270 472 L270 520" stroke="#1d2a33" stroke-width="4"/>
    <rect x="86" y="396" width="76" height="30" rx="13" fill="#ffffff" stroke="#1d2a33" stroke-width="4"/>
    <circle cx="132" cy="392" r="22" fill="#ffffff" stroke="#1d2a33" stroke-width="4"/>
    <path d="M123 388 C 126 385, 129 385, 132 388" fill="none" stroke="#1d2a33" stroke-width="3.4"/>
    <path d="M138 388 C 141 385, 144 385, 147 388" fill="none" stroke="#1d2a33" stroke-width="3.4"/>
    <path d="M160 474 L160 452 C 160 434, 178 420, 206 420 C 240 420, 258 428, 276 428 C 280 428, 282 431, 282 435 L282 474 Z" fill="#1f6f8b" stroke="#1d2a33" stroke-width="4"/>
  </g>
</svg>
