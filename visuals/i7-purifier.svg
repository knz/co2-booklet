<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- I7: air purifier. Clean air out of the top, filter slots in the body.
       A concentric ring on the front reads as a loudspeaker; slots do not. -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <g stroke="#1f6f8b" stroke-width="2.4">
      <path d="M17 7 L17 3"/>
      <path d="M24 6 L24 2"/>
      <path d="M31 7 L31 3"/>
    </g>
    <rect x="12" y="10" width="24" height="34" rx="5" fill="#e4f0f3" stroke="#1d2a33" stroke-width="2.8"/>
    <rect x="17" y="14" width="14" height="3.5" rx="1.75" fill="#1f6f8b" stroke="none"/>
    <g stroke="#1f6f8b" stroke-width="2.4">
      <path d="M17.5 24 L17.5 38"/>
      <path d="M24 24 L24 38"/>
      <path d="M30.5 24 L30.5 38"/>
    </g>
  </g>
</svg>
